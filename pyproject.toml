[project]
name = "creditshield-core"
version = "1.0.0"
description = "CreditShield — Hardship-First Relief Governance Engine (AWS Hackathon 2026)"
authors = [{ name = "CreditShield Team" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
